<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HY 영수증 관리</title><style>body{margin:0;background:#f8f3e9;color:#302d29;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:20px}h1{font-size:24px}nav{display:flex;gap:8px;margin:20px 0}button,.btn{cursor:pointer;border:1px solid #d5c9b6;background:white;border-radius:9px;padding:10px 13px;font-size:14px;color:#302d29}button.primary{background:#647f69;color:white;border:0}section{background:#fffdf9;padding:18px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 12px #5544220a}label{display:block;font-size:13px;margin:10px 0 5px}input,select{box-sizing:border-box;width:100%;border:1px solid #d9d1c5;padding:11px;border-radius:8px;font-size:16px;background:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.two{display:grid;grid-template-columns:2fr 1fr;gap:8px}.line{display:grid;grid-template-columns:2fr 80px 90px 38px;gap:6px;align-items:end;margin:9px 0}.line input{padding:9px}.line button{padding:9px 3px}.muted{color:#777;font-size:12px}.hidden{display:none}.receipt{background:white;border:1px solid #eee;padding:22px;border-radius:4px}.receipt h2{text-align:center;margin:0 0 18px}.dash{border-top:1px dashed #aaa;margin:16px 0}.rrow{display:flex;justify-content:space-between;gap:10px;margin:9px 0}.total{font-size:21px;font-weight:bold}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.product{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.product button{padding:7px}.foot{text-align:center;margin-top:30px;font-size:13px} @media(max-width:500px){main{padding:12px}.line{grid-template-columns:minmax(0,1fr) 58px 70px 32px;gap:4px}.line input,.line select{font-size:13px;padding:8px 3px}.line button{font-size:12px}.receipt{padding:16px}.grid{gap:5px}}@media print{body{background:white}main>h1,nav,section:not(#receiptSection),.actions,#receiptSection>h3{display:none!important}#receiptSection{box-shadow:none;padding:0;margin:0}.receipt{border:0}main{padding:0}}</style></head><body><main><h1>🍀 야쿠르트 영수증 관리</h1><p class="muted">제품 등록부터 고객 영수증 발송까지</p><nav><button onclick="tab('write')" id="wtab" class="primary">영수증 작성</button><button onclick="tab('manage')" id="mtab">제품 등록·관리</button></nav><section id="manage" class="hidden"><h3>제품 등록·관리</h3><div class="two"><div><label>제품명</label><input id="pname" placeholder="예: 윌"></div><div><label>단가 (원)</label><input id="pprice" type="number" min="0" placeholder="2000"></div></div><div class="actions"><button class="primary" onclick="saveProduct()" id="saveBtn">제품 등록</button><button onclick="resetForm()">입력 초기화</button></div><div id="products"></div><div class="actions"><button onclick="backup()">제품 목록 백업</button><button onclick="document.getElementById('restore').click()">백업 불러오기</button><input type="file" id="restore" accept="application/json,.json" class="hidden" onchange="restoreFile(event)"></div><p class="muted">제품 목록은 현재 브라우저에 보관됩니다. 기기를 바꾸거나 브라우저 데이터를 삭제하기 전에 백업하세요.</p></section><section id="write"><h3>영수증 작성</h3><label>고객명</label><input id="customer" placeholder="고객님 성함" oninput="render()"><label>배송·결제 날짜</label><div class="grid"><select id="year" onchange="changeDate()"></select><select id="month" onchange="changeDate()"></select><select id="day" onchange="render()"></select></div><h4>제품 선택 및 수량</h4><div id="lines"></div><button onclick="addLine()">+ 제품 추가</button></section><section id="receiptSection"><h3>영수증 미리보기</h3><div class="receipt" id="receipt"><h2>영 수 증</h2><div class="rrow"><span>고객명</span><strong id="rcustomer">고객님</strong></div><div class="rrow"><span>날짜</span><span id="rdate"></span></div><div class="dash"></div><div id="ritems"></div><div class="dash"></div><div class="rrow total"><span>총합계</span><span id="rtotal">0원</span></div><div class="dash"></div><div class="foot">야쿠르트 매니저<br>010-3214-5773<br> 감사합니다! 오늘도 좋은 하루 되세요🍀</div></div><div class="actions"><button class="primary" onclick="copyReceipt()">문자용 영수증 복사</button><button onclick="savePNG()">PNG 이미지 저장</button><button onclick="window.print()">인쇄 / PDF 저장</button></div><p class="muted" id="notice"></p></section></main><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>const KEY='hy_products_v1';let products=[],lines=[{id:1,pid:'',qty:1}],nextId=2,editing=null;try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('ko-KR')+'원',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(KEY,JSON.stringify(products))}function tab(t){$('write').classList.toggle('hidden',t!=='write');$('manage').classList.toggle('hidden',t!=='manage');$('wtab').classList.toggle('primary',t==='write');$('mtab').classList.toggle('primary',t==='manage')}function resetForm(){editing=null;$('pname').value='';$('pprice').value='';$('saveBtn').textContent='제품 등록'}function saveProduct(){let name=$('pname').value.trim(),price=Number($('pprice').value);if(!name||!Number.isFinite(price)||price<0||$('pprice').value===''){alert('제품명과 올바른 단가를 입력하세요.');return}if(editing){let p=products.find(p=>p.id===editing);if(p){p.name=name;p.price=price}}else products.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name,price});persist();resetForm();renderProducts();renderLines()}function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;editing=id;$('pname').value=p.name;$('pprice').value=p.price;$('saveBtn').textContent='수정 저장';tab('manage');$('pname').focus()}function deleteProduct(id){if(!confirm('이 제품을 삭제할까요?'))return;products=products.filter(p=>p.id!==id);persist();renderProducts();renderLines()}function renderProducts(){$('products').innerHTML=products.length?products.map(p=>`<div class="product"><span>${esc(p.name)} <small class="muted">${money(p.price)}</small></span><button data-edit="${p.id}">수정</button><button data-del="${p.id}">삭제</button></div>`).join(''):'<p class="muted">등록된 제품이 없습니다.</p>';$('products').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));$('products').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.del))}function addLine(){lines.push({id:nextId++,pid:'',qty:1});renderLines()}function renderLines(){$('lines').innerHTML=lines.map(l=>`<div class="line"><select aria-label="제품 선택" data-id="${l.id}" data-kind="pid"><option value="">제품 선택</option>${products.map(p=>`<option value="${p.id}" ${p.id===l.pid?'selected':''}>${esc(p.name)} (${money(p.price)})</option>`).join('')}</select><input aria-label="수량" type="number" min="0" step="1" value="${l.qty}" data-id="${l.id}" data-kind="qty"><strong class="muted" id="amount${l.id}"></strong><button aria-label="제품 행 삭제" data-remove="${l.id}">×</button></div>`).join('');$('lines').querySelectorAll('[data-kind]').forEach(el=>el.onchange=()=>{let l=lines.find(x=>x.id===Number(el.dataset.id));if(el.dataset.kind==='pid')l.pid=el.value;else l.qty=Math.max(0,Math.floor(Number(el.value)||0));render()});$('lines').querySelectorAll('[data-kind="qty"]').forEach(el=>el.oninput=()=>{let l=lines.find(x=>x.id===Number(el.dataset.id));l.qty=Math.max(0,Math.floor(Number(el.value)||0));render()});$('lines').querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{lines=lines.filter(l=>l.id!==Number(el.dataset.remove));renderLines()});render()}function selected(){return lines.map(l=>({p:products.find(p=>p.id===l.pid),qty:l.qty})).filter(x=>x.p&&x.qty>0)}function receiptText(){let d=dateString(),c=$('customer').value.trim()||'고객님',items=selected();return ['[영수증]',`고객명: ${c}`,`날짜: ${d}`,'--------------------',...items.map(({p,qty})=>`${p.name} / ${qty}개 × ${money(p.price)} = ${money(p.price*qty)}`),'--------------------',`총합계: ${money(items.reduce((s,x)=>s+x.p.price*x.qty,0))}`,'야쿠르트 매니저','010-3214-5773'].join('\n')}function dateString(){return `${$('year').value}년 ${Number($('month').value)}월 ${Number($('day').value)}일`}function render(){let items=selected();$('rcustomer').textContent=($('customer').value.trim()||'고객님');$('rdate').textContent=dateString();$('ritems').innerHTML=items.length?items.map(({p,qty})=>`<div class="rrow"><span>${esc(p.name)}<br><small class="muted">${money(p.price)} × ${qty}개</small></span><strong>${money(p.price*qty)}</strong></div>`).join(''):'<p class="muted">선택된 제품이 없습니다.</p>';$('rtotal').textContent=money(items.reduce((s,x)=>s+x.p.price*x.qty,0));lines.forEach(l=>{let p=products.find(x=>x.id===l.pid),el=$('amount'+l.id);if(el)el.textContent=p?money(p.price*l.qty):'0원'})}function changeDate(){let y=+$('year').value,m=+$('month').value,old=+$('day').value||1,n=new Date(y,m,0).getDate();$('day').innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1}일</option>`).join('');$('day').value=Math.min(old,n);render()}function initDate(){let d=new Date();$('year').innerHTML=Array.from({length:12},(_,i)=>`<option value="${2024+i}">${2024+i}년</option>`).join('');$('month').innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}월</option>`).join('');$('year').value=d.getFullYear();$('month').value=d.getMonth()+1;changeDate();$('day').value=d.getDate()}async function copyReceipt(){try{await navigator.clipboard.writeText(receiptText());$('notice').textContent='영수증 문구가 복사되었습니다.'}catch(e){let t=document.createElement('textarea');t.value=receiptText();document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();$('notice').textContent=ok?'영수증 문구가 복사되었습니다.':'복사에 실패했습니다. HTTPS 홈페이지에서 다시 시도하세요.'}}async function savePNG(){if(typeof html2canvas!=='function'){alert('이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');return}try{let canvas=await html2canvas($('receipt'),{backgroundColor:'#ffffff',scale:2});canvas.toBlob(blob=>{if(!blob){alert('이미지 생성에 실패했습니다.');return}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`영수증_${$('customer').value.trim()||'고객'}_${$('year').value}${$('month').value.padStart(2,'0')}${$('day').value.padStart(2,'0')}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)},'image/png')}catch(e){alert('이미지 저장에 실패했습니다.')}}function backup(){let blob=new Blob([JSON.stringify({version:1,products},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='야쿠르트_제품목록_백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}async function restoreFile(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text()),arr=Array.isArray(obj)?obj:obj.products;if(!Array.isArray(arr)||!arr.every(p=>typeof p.name==='string'&&typeof p.price==='number'&&p.price>=0))throw Error();if(!confirm('현재 제품 목록을 백업 파일의 목록으로 교체할까요?'))return;products=arr.map(p=>({id:String(p.id||Date.now()+Math.random()),name:p.name,price:p.price}));persist();renderProducts();renderLines();alert('제품 목록을 불러왔습니다.')}catch(err){alert('올바른 제품 백업 파일이 아닙니다.')}finally{e.target.value=''}}initDate();renderProducts();renderLines();</script></body></html>
